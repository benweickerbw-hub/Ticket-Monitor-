name: Ticketpreise aktualisieren

# Ziel dieser Datei: einmal taeglich die Preise abfragen, das Ergebnis nach
# docs/data.json schreiben und ins Repository zurueckcommitten. Die Seite
# unter GitHub Pages liest diese Datei und zeigt sie an.
#
# Ablageort im Repository, exakt so:
#   .github/workflows/update.yml

on:
  schedule:
    # Taeglich 07:00 UTC. GitHub startet geplante Laeufe mit bis zu einer
    # halben Stunde Verzoegerung, das ist normal.
    - cron: "0 7 * * *"

  # Erlaubt den Start von Hand ueber den Actions-Tab.
  workflow_dispatch:
    inputs:
      backfill_jahre:
        description: "Historische Jahre laden (leer lassen fuer den normalen Lauf)"
        required: false
        default: ""

# Ohne diese Zeile darf der Lauf nichts zurueckschreiben und bricht mit 403 ab.
# Zusaetzlich muss unter Settings > Actions > General bei Workflow permissions
# "Read and write permissions" eingestellt sein.
permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install --quiet requests openpyxl

      - name: Daten abrufen
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill_jahre }}
        run: |
          if [ -n "$BACKFILL" ]; then
            echo "Backfill ueber $BACKFILL Jahre"
            python ticket_monitor.py --backfill "$BACKFILL" --no-excel --json docs/data.json
          else
            echo "Normaler Durchlauf"
            python ticket_monitor.py --once --no-excel --json docs/data.json
          fi

      - name: Ergebnis zurueckschreiben
        run: |
          git config user.name "ticket-monitor"
          git config user.email "actions@github.com"
          git add docs/data.json ticketdaten.sqlite
          if git diff --staged --quiet; then
            echo "Keine Aenderungen, nichts zu committen."
          else
            git commit -m "Daten vom $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
